[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokelike.xyz.bot"
version = "0.1.0"
description = "Let bots play pokelike.xyz, headless, from a CLI or an HTTP API"
requires-python = ">=3.10"
dependencies = ["playwright>=1.55"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
pokelike = "pokelike.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokelike = ["core/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: richiede il browser e la copia offline del gioco"]
