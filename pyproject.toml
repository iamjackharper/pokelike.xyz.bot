[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokelike.xyz.bot"
version = "0.1.0"
description = "Fai giocare dei bot a pokelike.xyz, headless, da CLI o API HTTP"
requires-python = ">=3.10"
dependencies = ["playwright>=1.55"]

[project.scripts]
pokelike = "pokelike.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokelike = ["core/*.js"]
