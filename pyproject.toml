[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokelike"
version = "0.1.0"
description = "Gioca headless a pokelike.xyz da Python, riga di comando o API HTTP"
requires-python = ">=3.10"
dependencies = ["playwright>=1.55"]

[project.scripts]
pokelike = "pokelike.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokelike = ["core/*.js"]
